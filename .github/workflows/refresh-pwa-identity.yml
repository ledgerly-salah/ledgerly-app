name: Refresh Ledgerly PWA identity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create fresh manifest URL and identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('manifest.webmanifest')
          data = json.loads(src.read_text(encoding='utf-8'))
          data['id'] = '/ledgerly-app/ledgerly-pwa-v2'
          Path('ledgerly-v2.webmanifest').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="./manifest.webmanifest"', 'href="./ledgerly-v2.webmanifest"')
          p.write_text(s, encoding='utf-8')

          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("ledgerly-shell-3.1.0-20261005-r3", "ledgerly-shell-3.1.0-20261005-r4")
          s = s.replace("'./manifest.webmanifest'", "'./ledgerly-v2.webmanifest'")
          s = s.replace("url.pathname.endsWith('/manifest.webmanifest')", "url.pathname.endsWith('/ledgerly-v2.webmanifest')")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js ledgerly-v2.webmanifest
          git commit -m "Refresh Ledgerly PWA install identity"
          git push origin main
