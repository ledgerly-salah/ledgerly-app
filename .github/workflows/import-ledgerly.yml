name: Import Ledgerly from electricity-split-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4

      - name: Fetch current Ledgerly production files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zareifsalah-bit/electricity-split-app.git /tmp/electricity-split-app
          src=/tmp/electricity-split-app/ledgerly

          files=(
            index.html
            app.3.1.0.js
            ledger-core.3.1.0.js
            storage.3.1.0.js
            crypto.3.1.0.js
            migrations.3.1.0.js
            i18n.3.1.0.js
            pdf.3.1.0.js
            styles.3.1.0.css
            service-worker.js
            manifest.webmanifest
            logo.svg
            icon-192.png
            icon-512.png
            icon-maskable-512.png
            version.json
            LEDGERLY_RELEASE.json
            BASELINE.txt
            RELEASE_NOTES.txt
            TEST_CHECKLIST.txt
            UPLOAD_INSTRUCTIONS.txt
            Personal_Debt_Dashboard.html
            ledgerly_update.html
          )

          for f in "${files[@]}"; do
            test -f "$src/$f" || { echo "Missing source file: $f"; exit 1; }
            cp "$src/$f" "./$f"
          done

          : > .nojekyll

      - name: Verify standalone PWA files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f icon-192.png
          test -f icon-512.png
          test -f icon-maskable-512.png
          grep -q 'Ledgerly' manifest.webmanifest
          grep -q '3.1.0' version.json

      - name: Commit imported Ledgerly files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import Ledgerly 3.1.0 standalone [ledgerly-sync]"
          git push origin main
